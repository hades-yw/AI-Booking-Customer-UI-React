server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed build assets are immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Real file loaded by keycloak-js in a same-origin iframe (silent check-sso);
    # must not be framed-denied or cached.
    location = /silent-check-sso.html {
        add_header Cache-Control "no-store";
    }

    # SPA shell: client-side routes (incl. /auth/callback) fall back to index.html.
    # Never cache it so a new release is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
